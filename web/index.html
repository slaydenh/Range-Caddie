<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#34B53D">
<title>Range Caddy</title>
<style>
  :root {
    --green: #34B53D;
    --green-dark: #2A8E30;
    --green-bg: rgba(52, 181, 61, 0.12);
    --green-border: rgba(52, 181, 61, 0.32);
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --card-2: #F7F7FB;
    --text: #1C1C1E;
    --text-secondary: #6E6E73;
    --text-tertiary: #98989D;
    --border: #E5E5EA;
    --red: #FF3B30;
    --orange: #FF9500;
    --yellow: #FFCC00;
    --mint: #00C7BE;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --card-2: #2C2C2E;
      --text: #FFFFFF;
      --text-secondary: #98989D;
      --text-tertiary: #6E6E73;
      --border: #38383A;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.4;
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }
  #app {
    max-width: 540px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: 96px;
    min-height: 100vh;
  }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 4px 0; }
  h2 { font-size: 22px; font-weight: 700; margin: 0 0 12px 0; }
  h3 { font-size: 17px; font-weight: 600; margin: 0 0 8px 0; }
  p { margin: 0 0 8px 0; }
  .muted { color: var(--text-secondary); font-size: 14px; }
  .tiny { color: var(--text-tertiary); font-size: 12px; }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .card-flat {
    background: var(--card-2);
    border-radius: 12px;
    padding: 12px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.spread { justify-content: space-between; }
  .col { display: flex; flex-direction: column; gap: 8px; }

  /* Top bar */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .top h1 { margin: 0; font-size: 32px; }
  .top .back {
    background: none; border: none; color: var(--green);
    font-size: 17px; font-weight: 600; padding: 4px 0; cursor: pointer;
  }
  .top .spacer { width: 60px; }

  /* Buttons */
  .btn {
    border: none;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.1s;
    font-family: inherit;
  }
  .btn:active { opacity: 0.7; }
  .btn-primary { background: var(--green); color: white; }
  .btn-secondary { background: var(--green-bg); color: var(--green); }
  .btn-ghost { background: var(--card-2); color: var(--text); }
  .btn-danger { background: rgba(255, 59, 48, 0.12); color: var(--red); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Hero card on home */
  .hero {
    background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
    color: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(52, 181, 61, 0.3);
  }
  .hero h2 { color: white; margin-bottom: 4px; }
  .hero p { color: rgba(255,255,255,0.85); margin: 0; }

  /* Pills, chips, badges */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 99px;
    background: var(--green-bg);
    color: var(--green);
    font-size: 12px;
    font-weight: 600;
  }
  .pill-muted {
    background: var(--card-2);
    color: var(--text-secondary);
  }
  .pill.red { background: rgba(255,59,48,0.12); color: var(--red); }
  .pill.orange { background: rgba(255,149,0,0.12); color: var(--orange); }

  /* Club chips (selectable) */
  .chip-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
  }
  .chip {
    background: var(--card-2);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    font-size: 15px;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-family: inherit;
  }
  .chip.on {
    background: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green);
  }
  .chip .checkmark {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--border);
    display: inline-block;
  }
  .chip.on .checkmark {
    background: var(--green);
    border-color: var(--green);
    position: relative;
  }
  .chip.on .checkmark::after {
    content: '';
    position: absolute;
    top: 2px; left: 5px;
    width: 4px; height: 8px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  /* Slider */
  .slider-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .slider-row .val { font-size: 28px; font-weight: 700; }
  .slider-row .label { color: var(--text-secondary); font-size: 14px; }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--card-2);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--green);
    cursor: pointer;
    border: 4px solid var(--card);
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  input[type=range]::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--green);
    cursor: pointer;
    border: 3px solid var(--card);
  }

  /* Facility picker */
  .picker {
    background: var(--card-2);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 12px 14px;
    width: 100%;
    text-align: left;
    font-size: 15px;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    font-family: inherit;
  }
  .picker .chev { color: var(--text-tertiary); }
  .facility-list .picker { margin-bottom: 6px; }
  .facility-list .picker.on { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }

  /* Drill rows */
  .drill-row {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.1s;
    box-shadow: var(--shadow);
  }
  .drill-row:active { background: var(--card-2); }
  .drill-row .title { font-weight: 600; margin-top: 6px; }
  .drill-row .summary { color: var(--text-secondary); font-size: 14px; margin-top: 2px; }

  /* Timer */
  .timer-display {
    font-size: 56px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
    font-family: -apple-system, "SF Mono", monospace;
    letter-spacing: -2px;
    margin: 12px 0;
  }
  .timer-display.over { color: var(--orange); }

  /* Instructions */
  .steps { padding-left: 0; list-style: none; margin: 0; }
  .steps li { display: flex; gap: 10px; margin-bottom: 8px; align-items: flex-start; }
  .steps .num {
    color: var(--green); font-weight: 700; flex-shrink: 0;
  }

  /* Rating buttons */
  .rate-list { display: flex; flex-direction: column; gap: 8px; }
  .rate-btn {
    background: var(--card-2);
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 14px;
    width: 100%;
    text-align: left;
    font-size: 16px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .rate-btn .dot {
    width: 16px; height: 16px; border-radius: 50%;
  }
  .rate-btn.selected { border-color: currentColor; }
  .rate-btn.poor       { color: var(--red); }
  .rate-btn.belowAverage { color: var(--orange); }
  .rate-btn.average    { color: var(--yellow); }
  .rate-btn.good       { color: var(--mint); }
  .rate-btn.excellent  { color: var(--green); }
  .rate-btn .dot { background: currentColor; }
  .rate-btn.selected { background: color-mix(in srgb, currentColor 12%, transparent); }

  /* Skill bars */
  .skill-row { margin: 10px 0; }
  .skill-row .top-row {
    display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px;
  }
  .skill-bar {
    position: relative;
    height: 10px;
    background: var(--card-2);
    border-radius: 5px;
    overflow: hidden;
  }
  .skill-bar .uncertainty {
    position: absolute;
    top: 0; bottom: 0;
    opacity: 0.25;
  }
  .skill-bar .mean {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    border-radius: 5px;
  }

  /* Bottom tabs */
  .tabs {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    z-index: 100;
  }
  .tab {
    background: none;
    border: none;
    flex: 1;
    padding: 8px;
    color: var(--text-tertiary);
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .tab .icon { font-size: 22px; line-height: 1; }
  .tab.active { color: var(--green); }

  /* Progress bar */
  .progress {
    height: 6px;
    background: var(--card-2);
    border-radius: 3px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress .fill {
    height: 100%;
    background: var(--green);
    transition: width 0.3s;
  }

  /* Phase header tag */
  .phase-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--green);
    margin-bottom: 4px;
  }
  .phase-tag::before { content: '◆ '; }

  /* Modal-ish bottom sheet */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    background: var(--card);
    width: 100%;
    max-width: 540px;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    max-height: 85vh;
    overflow-y: auto;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .sheet .handle {
    width: 36px; height: 5px; background: var(--border);
    border-radius: 3px; margin: -8px auto 12px;
  }

  /* Empty states */
  .empty {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-tertiary);
  }
  .empty .icon { font-size: 56px; margin-bottom: 12px; }

  /* Stat pill */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat {
    background: var(--card-2);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat .val { font-size: 18px; font-weight: 700; }
  .stat .label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }

  /* Inputs */
  input[type=text], textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    background: var(--card-2);
    color: var(--text);
    font-family: inherit;
    resize: vertical;
  }
  textarea { min-height: 80px; }

  /* Delta badge */
  .delta-pos { color: var(--green); font-weight: 700; }
  .delta-neg { color: var(--red); font-weight: 700; }

  /* Utility */
  .hidden { display: none !important; }
  .center { text-align: center; }
  .mt-12 { margin-top: 12px; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
  .mb-8 { margin-bottom: 8px; }
  .mb-16 { margin-bottom: 16px; }
  .gap-12 { gap: 12px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   Range Caddy — single-file web app
   Mirrors the iOS app's engine and data model.
   ============================================================ */

// ---------- 1. Static data ----------

const CLUBS = {
  putter:       { name: "Putter",        emoji: "⛳" },
  wedges:       { name: "Wedges",        emoji: "🪶" },
  shortIrons:   { name: "Short Irons",   emoji: "🎯" },
  midIrons:     { name: "Mid Irons",     emoji: "🔭" },
  longIrons:    { name: "Long Irons",    emoji: "↗️" },
  hybrids:      { name: "Hybrids",       emoji: "🔀" },
  fairwayWoods: { name: "Fairway Woods", emoji: "🌳" },
  driver:       { name: "Driver",        emoji: "⚡" },
};
const CLUB_KEYS = Object.keys(CLUBS);

const FACILITIES = {
  fullFacility:    { name: "Full Practice Facility",  emoji: "⭐", range: true,  short: true,  putt: true  },
  rangeShortGame:  { name: "Range + Short Game",      emoji: "🎯", range: true,  short: true,  putt: false },
  rangePutting:    { name: "Range + Putting Green",   emoji: "🏁", range: true,  short: false, putt: true  },
  rangeOnly:       { name: "Driving Range Only",      emoji: "🏌️", range: true,  short: false, putt: false },
  shortGameOnly:   { name: "Short Game Area",         emoji: "🍃", range: false, short: true,  putt: false },
  puttingGreenOnly:{ name: "Putting Green",           emoji: "⛳", range: false, short: false, putt: true  },
  simulator:       { name: "Simulator / Indoor",      emoji: "📺", range: true,  short: true,  putt: true  },
  home:            { name: "Home / Mat",              emoji: "🏠", range: true,  short: true,  putt: true  },
};

const SKILLS = {
  puttingShort:      "Short Putting",
  puttingMid:        "Mid Putting",
  puttingLag:        "Lag Putting",
  puttingBreak:      "Breaking Putts",
  chippingGreenside: "Greenside Chipping",
  chippingPitch:     "Pitching",
  wedgePartial:      "Partial Wedges",
  ironShort:         "Short Irons",
  ironMid:           "Mid Irons",
  ironLong:          "Long Irons",
  woodsHybrid:       "Hybrids / Woods",
  driverAccuracy:    "Driver Accuracy",
  driverDistance:    "Driver Distance",
  mentalPressure:    "Pressure / Closing",
  transferRandom:    "Random / Transfer",
};
const SKILL_KEYS = Object.keys(SKILLS);

const SKILL_GROUPS = [
  { title: "Putting",     keys: ["puttingShort", "puttingMid", "puttingLag", "puttingBreak"] },
  { title: "Short game",  keys: ["chippingGreenside", "chippingPitch", "wedgePartial"] },
  { title: "Full swing",  keys: ["ironShort", "ironMid", "ironLong", "woodsHybrid", "driverAccuracy", "driverDistance"] },
  { title: "Game skills", keys: ["mentalPressure", "transferRandom"] },
];

// Zone-required-by-skill — used to filter drills by facility.
const SKILL_ZONE = {
  puttingShort: "putting", puttingMid: "putting", puttingLag: "putting", puttingBreak: "putting",
  chippingGreenside: "shortGame", chippingPitch: "shortGame",
  wedgePartial: "shortGameOrRange",
  ironShort: "range", ironMid: "range", ironLong: "range",
  woodsHybrid: "range", driverAccuracy: "range", driverDistance: "range",
  mentalPressure: "any", transferRandom: "any",
};

function zoneSupported(zone, facility) {
  const f = FACILITIES[facility];
  switch (zone) {
    case "putting":          return f.putt;
    case "shortGame":        return f.short;
    case "shortGameOrRange": return f.short || f.range;
    case "range":            return f.range;
    case "any":              return true;
  }
  return false;
}

// ---------- 2. Drill library (40 drills) ----------

const DRILLS = [
  // Putting
  { id:"putt.gate.3ft", name:"Gate Drill — 3 ft", summary:"Push 3-foot putts through a narrow tee gate to dial in face control.",
    instructions:[
      "Set two tees just wider than your putter head, 3 ft from a flat hole.",
      "Place a ball 3 ft from the cup, on the line through the gate.",
      "Make 10 putts in a row through the gate, into the cup.",
      "Reset to zero if a putt misses the gate or the cup."],
    successCriteria:"10 in a row through the gate AND into the hole.",
    skillAreas:["puttingShort"], clubs:["putter"], defaultMinutes:8, suitablePhases:["warmup","block","cooldown"], zone:"putting", difficulty:2, reps:"Until you can chain 10" },

  { id:"putt.clock.3ft", name:"Clock Drill", summary:"Six 3-foot putts around the hole. Miss one and restart.",
    instructions:[
      "Place six balls evenly around the hole at 3 ft (12, 2, 4, 6, 8, 10 o'clock).",
      "Hole each ball in order without missing.",
      "If you miss, reset all six and start again."],
    successCriteria:"Clear the clock without a miss.",
    skillAreas:["puttingShort","mentalPressure"], clubs:["putter"], defaultMinutes:10, suitablePhases:["block","transfer"], zone:"putting", difficulty:3, reps:"Up to 3 clean rounds" },

  { id:"putt.ladder", name:"Distance Ladder", summary:"Lag to 10, 20, 30, 40 ft targets — distance control without a hole.",
    instructions:[
      "Drop tees as targets at 10, 20, 30, and 40 feet on a flat stretch of green.",
      "Hit one ball to each target, in order, then back down.",
      "Score: inside 1 putter length = 2 pts, inside 3 ft = 1 pt."],
    successCriteria:"Score 12+ over 8 putts (4 up, 4 down).",
    skillAreas:["puttingLag","puttingMid"], clubs:["putter"], defaultMinutes:10, suitablePhases:["block"], zone:"putting", difficulty:2, reps:"2-3 sets of 8" },

  { id:"putt.9ball", name:"9-Ball Test", summary:"3 balls each from 3, 6, and 9 feet. Make as many as possible.",
    instructions:[
      "Find a fairly straight putt.",
      "Hit 3 from 3 ft, 3 from 6 ft, 3 from 9 ft.",
      "Track your make total each round."],
    successCriteria:"Make 7 of 9 to pass.",
    skillAreas:["puttingShort","puttingMid"], clubs:["putter"], defaultMinutes:10, suitablePhases:["block","transfer"], zone:"putting", difficulty:3, reps:"3 rounds" },

  { id:"putt.break.read", name:"Read & Roll", summary:"Read a breaking putt, commit, hit. Build trust on slope.",
    instructions:[
      "Find a 10-15 ft breaking putt.",
      "Read from low side. Pick an apex. Commit.",
      "Hit 3 balls from the same spot. Reset and pick a new break.",
      "Aim to start every ball on your chosen line."],
    successCriteria:"All 3 balls start on the chosen line; majority finish inside 18 inches.",
    skillAreas:["puttingBreak","puttingMid"], clubs:["putter"], defaultMinutes:12, suitablePhases:["block"], zone:"putting", difficulty:4, reps:"5 different breaks" },

  { id:"putt.eyesclosed", name:"Eyes-Closed Feel", summary:"Roll 15-foot putts with eyes closed to build internal distance feel.",
    instructions:[
      "Pick a 15 ft target on a flat section.",
      "Take your stance, look at the target, close your eyes.",
      "Make the stroke with eyes closed.",
      "Open eyes only after the putt is rolling. Adjust feel, not mechanics."],
    successCriteria:"Average finish inside a 3 ft circle on 10 putts.",
    skillAreas:["puttingLag"], clubs:["putter"], defaultMinutes:8, suitablePhases:["warmup","cooldown"], zone:"putting", difficulty:2, reps:"10 putts" },

  { id:"putt.onehanded", name:"One-Handed Putts", summary:"Six-foot putts with the trail hand only — exposes face control issues.",
    instructions:[
      "Use only your trail hand on the grip (right hand for right-handers).",
      "Hit 10 putts from 6 ft to a flat hole.",
      "Focus on stable wrist and on-center contact."],
    successCriteria:"Make 5 of 10.",
    skillAreas:["puttingShort","puttingMid"], clubs:["putter"], defaultMinutes:6, suitablePhases:["warmup","block"], zone:"putting", difficulty:3, reps:"10 putts" },

  { id:"putt.lag.funnel", name:"Lag Funnel", summary:"Long putts must finish inside a 3-foot circle around the hole.",
    instructions:[
      "Mark a 3 ft circle around a hole with tees (or eyeball it).",
      "Hit 6 putts from 30 ft. Then 6 from 40 ft. Then 6 from 50 ft.",
      "Goal: get every ball into the circle."],
    successCriteria:"≥14/18 in the circle.",
    skillAreas:["puttingLag"], clubs:["putter"], defaultMinutes:12, suitablePhases:["block"], zone:"putting", difficulty:3, reps:"18 putts" },

  { id:"putt.holehigh.5ft", name:"Hole-High 5-Footers", summary:"Roll every 5-foot putt past the hole on the right line.",
    instructions:[
      "Pick a flat 5 ft putt.",
      "Every ball must reach the hole — short doesn't count.",
      "10 putts. Track makes."],
    successCriteria:"Make 7 of 10.",
    skillAreas:["puttingShort","mentalPressure"], clubs:["putter"], defaultMinutes:6, suitablePhases:["block","transfer"], zone:"putting", difficulty:3, reps:"10 putts" },

  { id:"putt.chip.combo", name:"Chip-Then-Putt", summary:"Chip one, putt out. Repeat. Forces you to commit to the first putt.",
    instructions:[
      "From off the green, chip one ball at a hole.",
      "Wherever it stops, putt it out (no marker).",
      "Track 'up & downs' — got it in 2 shots? Pass.",
      "Repeat 8 times from different lies."],
    successCriteria:"5 of 8 up & down.",
    skillAreas:["transferRandom","chippingGreenside","puttingShort"], clubs:["wedges","putter"], defaultMinutes:12, suitablePhases:["transfer"], zone:"shortGame", difficulty:3, reps:"8 attempts" },

  // Chipping & Pitching
  { id:"chip.landingpad", name:"Landing Pad", summary:"Land every chip on a towel — landing-spot control.",
    instructions:[
      "Lay a towel on the green about 1/3 of the way to the hole.",
      "Chip 10 balls trying to land each one on the towel.",

const DRILLS_BY_ID = Object.fromEntries(DRILLS.map(d => [d.id, d]));

// ---------- 3. Storage ----------

const STORAGE_KEY = "rangecaddy.v1";

function defaultState() {
  return {
    skills: {},               // { skillKey: { alpha, beta, observationCount, lastUpdated } }
    sessions: [],             // newest first
    preferences: {
      lastFacility: "fullFacility",
      lastClubs: ["putter", "wedges", "shortIrons", "midIrons", "driver"],
      lastTargetMinutes: 45,
    },
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    return { ...defaultState(), ...s };
  } catch (e) {
    console.warn("Failed to load state:", e);
    return defaultState();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn("Failed to save state:", e);
  }
}

function freshSkill() {
  return { alpha: 2.0, beta: 2.0, observationCount: 0, lastUpdated: null };
}

// ---------- 4. Bayesian engine ----------

const BASE_WEIGHT = 2.0;
const NEUTRAL_ALPHA = 2.0;
const NEUTRAL_BETA = 2.0;
const DECAY_HALF_LIFE_DAYS = 30;

const RATING_TO_FRACTION = { 1: 0.10, 2: 0.30, 3: 0.55, 4: 0.75, 5: 0.92 };
const RATING_LABELS = { 1: "Poor", 2: "Below", 3: "Average", 4: "Good", 5: "Excellent" };
const RATING_CLASSES = { 1: "poor", 2: "belowAverage", 3: "average", 4: "good", 5: "excellent" };

function skillMean(s) {
  if (!s) return 0.5;
  return s.alpha / (s.alpha + s.beta);
}
function skillStddev(s) {
  if (!s) return 0.25;
  const sum = s.alpha + s.beta;
  if (sum <= 1) return 0.5;
  const v = (s.alpha * s.beta) / (sum * sum * (sum + 1));
  return Math.sqrt(v);
}

function decayInPlace(s) {
  if (!s || !s.lastUpdated) return;
  const days = (Date.now() - s.lastUpdated) / 86_400_000;
  if (days <= 0) return;
  const factor = Math.pow(0.5, days / DECAY_HALF_LIFE_DAYS);
  s.alpha = NEUTRAL_ALPHA + (s.alpha - NEUTRAL_ALPHA) * factor;
  s.beta  = NEUTRAL_BETA  + (s.beta  - NEUTRAL_BETA)  * factor;
}

function applyRating(rating, drill) {
  drill.skillAreas.forEach((skillKey, idx) => {
    const posWeight = idx === 0 ? 1.0 : idx === 1 ? 0.6 : 0.4;
    const difficultyBoost = 0.8 + 0.1 * drill.difficulty;
    const n = BASE_WEIGHT * posWeight * difficultyBoost;
    const r = RATING_TO_FRACTION[rating];
    if (!state.skills[skillKey]) state.skills[skillKey] = freshSkill();
    const s = state.skills[skillKey];
    decayInPlace(s);
    s.alpha += n * r;
    s.beta  += n * (1 - r);
    s.observationCount += 1;
    s.lastUpdated = Date.now();
  });
}

// ---------- 5. Beta sampler (Marsaglia-Tsang Gamma → Beta) ----------

function standardNormal() {
  const u1 = Math.random() + 1e-12;
  const u2 = Math.random();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}

function gammaSample(shape) {
  if (shape < 1) {
    const u = Math.random() + 1e-12;
    return gammaSample(shape + 1) * Math.pow(u, 1.0 / shape);
  }
  const d = shape - 1.0 / 3.0;
  const c = 1.0 / Math.sqrt(9.0 * d);
  // Limit iterations as a safety net (extremely rare to need many).
  for (let i = 0; i < 1000; i++) {
    const x = standardNormal();
    const v = Math.pow(1 + c * x, 3);
    if (v <= 0) continue;
    const u = Math.random() + 1e-12;
    const x2 = x * x;
    if (u < 1 - 0.0331 * x2 * x2) return d * v;
    if (Math.log(u) < 0.5 * x2 + d * (1 - v + Math.log(v))) return d * v;
  }
  return d; // fallback (mean of Gamma(d, 1) ~= d)
}

function betaSample(alpha, beta) {
  const a = Math.max(alpha, 1e-6);
  const b = Math.max(beta, 1e-6);
  const x = gammaSample(a);
  const y = gammaSample(b);
  return x / (x + y + 1e-12);
}

function sampleTheta(skillKey) {
  const s = state.skills[skillKey];
  if (s) return betaSample(s.alpha, s.beta);
  return betaSample(NEUTRAL_ALPHA, NEUTRAL_BETA);
}

/// "Need" score per skill, used by the session generator.
/// Deterministic-leaning: high when posterior mean is low (weakness),
/// with a smaller bonus from stddev (uncertainty) so untouched skills
/// still get probed occasionally. A tiny noise term breaks ties.
/// This is more predictable for users than pure Thompson sampling — when
/// you rate something poorly, you want to see more of it next time.
function needFor(skillKey) {
  const s = state.skills[skillKey];
  const mean = skillMean(s);
  const sd = skillStddev(s);
  const noise = (Math.random() - 0.5) * 0.04;
  return Math.max(0, (1 - mean) + 0.2 * sd + noise);
}

function currentMeans() {
  const out = {};
  for (const k of SKILL_KEYS) out[k] = skillMean(state.skills[k]);
  return out;
}

// ---------- 6. Session generator ----------

function timeBudget(target) {
  const warm = Math.max(5, Math.min(Math.round(target * 0.15), 10));
  const cool = target >= 35 ? Math.max(3, Math.min(Math.round(target * 0.10), 6)) : 0;
  const transfer = target >= 40 ? Math.max(5, Math.min(Math.round(target * 0.20), 12)) : 0;
  const block = Math.max(10, target - warm - cool - transfer);
  return { warmup: warm, block, transfer, cooldown: cool };
}

function generatePlan({ facility, clubs, targetMinutes }) {
  const clubSet = new Set(clubs);
  const candidates = DRILLS.filter(d =>
    zoneSupported(d.zone, facility) && d.clubs.every(c => clubSet.has(c))
  );

  const recentIDs = new Set();
  state.sessions.slice(0, 2).forEach(s => s.drills.forEach(d => recentIDs.add(d.drillID)));

  // Compute per-skill "need" (UCB-style: exploit known weaknesses,
  // with small exploration bonus from uncertainty).
  const need = {};
  SKILL_KEYS.forEach(k => { need[k] = needFor(k); });

  // Zero out skills no candidate can train.
  const trainable = new Set();
  candidates.forEach(c => c.skillAreas.forEach(s => trainable.add(s)));
  Object.keys(need).forEach(k => { if (!trainable.has(k)) need[k] = 0; });

  function score(drill) {
    if (drill.skillAreas.length === 0) return 0;
    let tot = 0, wsum = 0;
    drill.skillAreas.forEach((s, idx) => {
      const w = idx === 0 ? 1.0 : idx === 1 ? 0.6 : 0.4;
      tot += w * (need[s] || 0);
      wsum += w;
    });
    let s = tot / wsum;
    if (recentIDs.has(drill.id)) s *= 0.5;
    return s;
  }

  function pickBest(pool) {
    if (pool.length === 0) return null;
    return pool.reduce((best, d) => score(d) > score(best) ? d : best);
  }

  const budget = timeBudget(targetMinutes);
  const picked = [];
  const used = new Set();

  // Warm-up
  const warmupPool = candidates.filter(d =>
    !used.has(d.id) && d.suitablePhases.includes("warmup") && d.difficulty <= 3
  );
  const warmup = pickBest(warmupPool);
  if (warmup) {
    used.add(warmup.id);
    picked.push({ drill: warmup, phase: "warmup", minutes: budget.warmup });
  }

  // Focus blocks
  let remaining = budget.block;
  const maxBlocks = targetMinutes >= 30 ? 3 : targetMinutes >= 18 ? 2 : 1;
  const blockPicks = [];
  for (let i = 0; i < maxBlocks; i++) {
    if (remaining < 6) break;
    const blockPool = candidates.filter(d =>
      !used.has(d.id) && d.suitablePhases.includes("block")
    );
    const pick = pickBest(blockPool);
    if (!pick) break;
    const w = i === 0 ? 0.50 : i === 1 ? 0.30 : 0.20;
    let minutes = Math.max(6, Math.min(Math.round(budget.block * w), remaining));
    if (Math.abs(minutes - pick.defaultMinutes) <= 4) {
      minutes = Math.min(pick.defaultMinutes, remaining);
    }
    remaining -= minutes;
    used.add(pick.id);
    const planned = { drill: pick, phase: "block", minutes };
    blockPicks.push(planned);
    picked.push(planned);
  }
  // Donate any leftover block minutes to the largest block.
  if (remaining > 0 && blockPicks.length > 0) {
    const biggest = blockPicks.reduce((a, b) => a.minutes >= b.minutes ? a : b);
    biggest.minutes += remaining;
  }

  // Transfer
  if (budget.transfer > 0) {
    const transferPool = candidates.filter(d =>
      !used.has(d.id) && d.suitablePhases.includes("transfer")
    );
    const t = pickBest(transferPool);
    if (t) {
      used.add(t.id);
      picked.push({ drill: t, phase: "transfer", minutes: budget.transfer });
    }
  }

  // Cool-down
  if (budget.cooldown > 0) {
    const cooldownPool = candidates.filter(d =>
      !used.has(d.id) && d.suitablePhases.includes("cooldown") && d.difficulty <= 3
    );
    const c = pickBest(cooldownPool);
    if (c) {
      picked.push({ drill: c, phase: "cooldown", minutes: budget.cooldown });
    }
  }

  // Fallback: nothing matched (extremely restrictive inputs).
  if (picked.length === 0 && candidates.length > 0) {
    const fb = pickBest(candidates);
    picked.push({ drill: fb, phase: "block", minutes: targetMinutes });
  }

  return picked;
}

function createSession({ facility, clubs, targetMinutes }) {
  const plan = generatePlan({ facility, clubs, targetMinutes });
  const snapshot = currentMeans();
  const session = {
    id: "s_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    createdAt: Date.now(),
    completedAt: null,
    facility,
    clubs: [...clubs],
    targetMinutes,
    skillSnapshot: snapshot,
    drills: plan.map((p, i) => ({
      drillID: p.drill.id,
      order: i,
      phase: p.phase,
      plannedMinutes: p.minutes,
      rating: null,
      notes: "",
      completedAt: null,
    })),
  };
  state.sessions.unshift(session);
  saveState();
  return session;
}

// ---------- 7. State + router ----------

let state = loadState();

// View state — not persisted.
const view = {
  screen: "home",       // "home" | "setup" | "plan" | "runner" | "summary" | "history" | "skills"
  sessionId: null,
  drillIndex: 0,
  rating: { open: false, rating: null, notes: "" },
  // setup-form working values
  setup: null,
  // timer
  timer: { running: false, elapsed: 0, planned: 0, intervalId: null },
};

function navigate(screen, params = {}) {
  view.screen = screen;
  if (params.sessionId !== undefined) view.sessionId = params.sessionId;
  if (params.drillIndex !== undefined) view.drillIndex = params.drillIndex;
  stopTimer();
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function getSession(id) {
  return state.sessions.find(s => s.id === id);
}

// ---------- 8. Timer ----------

function startTimer(plannedMinutes) {
  stopTimer();
  view.timer.planned = plannedMinutes;
  if (!view.timer.elapsed) view.timer.elapsed = 0;
  view.timer.running = true;
  view.timer.intervalId = setInterval(() => {
    view.timer.elapsed += 1;
    updateTimerUI();
  }, 1000);
  updateTimerUI();
}
function pauseTimer() {
  view.timer.running = false;
  if (view.timer.intervalId) { clearInterval(view.timer.intervalId); view.timer.intervalId = null; }
  updateTimerUI();
}
function stopTimer() {
  if (view.timer.intervalId) { clearInterval(view.timer.intervalId); view.timer.intervalId = null; }
  view.timer.running = false;
  view.timer.elapsed = 0;
}
function resetTimer() {
  pauseTimer();
  view.timer.elapsed = 0;
  updateTimerUI();
}
function fmtTime(t) {
  const m = Math.floor(t / 60), s = t % 60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function updateTimerUI() {
  const d = document.getElementById("timerDisplay");
  if (d) {
    d.textContent = fmtTime(view.timer.elapsed);
    if (view.timer.elapsed > view.timer.planned * 60) d.classList.add("over");
    else d.classList.remove("over");
  }
  const btn = document.getElementById("timerToggle");
  if (btn) {
    btn.textContent = view.timer.running ? "⏸  Pause"
                    : view.timer.elapsed > 0 ? "▶  Resume"
                    : "▶  Start";
  }
}

// ---------- 9. Rendering ----------

function esc(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function colorForMean(m) {
  if (m < 0.35) return "var(--red)";
  if (m < 0.55) return "var(--orange)";
  if (m < 0.7)  return "var(--yellow)";
  if (m < 0.85) return "var(--mint)";
  return "var(--green)";
}

function topBar(title, backScreen) {
  if (!backScreen) return `<div class="top"><h1>${esc(title)}</h1></div>`;
  return `
    <div class="top">
      <button class="back" data-action="navigate" data-screen="${backScreen}">‹ Back</button>
      <h2 style="margin:0;">${esc(title)}</h2>
      <div class="spacer"></div>
    </div>`;
}

function tabBar() {
  const tabs = [
    { key: "home",    label: "Practice", icon: "🏌️", screens: ["home","setup","plan","runner","summary"] },
    { key: "history", label: "History",  icon: "🕘", screens: ["history"] },
    { key: "skills",  label: "Skills",   icon: "📊", screens: ["skills"] },
  ];
  return `<div class="tabs">
    ${tabs.map(t => `
      <button class="tab ${t.screens.includes(view.screen) ? "active" : ""}"
              data-action="navigate" data-screen="${t.key}">
        <div class="icon">${t.icon}</div>
        <div>${t.label}</div>
      </button>`).join("")}
  </div>`;
}

// ----- Plan -----
function renderPlan() {
  const s = getSession(view.sessionId);
  if (!s) { return renderEmpty("Session not found"); }
  const done = s.drills.filter(d => d.rating !== null).length;
  const pct = s.drills.length === 0 ? 0 : (done / s.drills.length) * 100;
  const firstUnrated = s.drills.findIndex(d => d.rating === null);
  const startIndex = firstUnrated === -1 ? 0 : firstUnrated;

  return `
    ${topBar("Your Session", "home")}
    <div class="card">
      <div class="row spread mb-8">
        <span>${FACILITIES[s.facility].emoji} ${FACILITIES[s.facility].name}</span>
        <span class="muted">${s.targetMinutes} min · ${s.drills.length} drills</span>
      </div>
      <div class="progress"><div class="fill" style="width:${pct}%;"></div></div>
      <div class="muted" style="font-size:13px;">${done} of ${s.drills.length} rated</div>
    </div>

    ${s.drills.map((dr, idx) => {
      const drill = DRILLS_BY_ID[dr.drillID];
      if (!drill) return "";
      const phaseColor = phaseEmoji(dr.phase);
      const rated = dr.rating !== null;
      return `
        <div class="drill-row" data-action="open-runner" data-index="${idx}">
          <div class="row spread">
            <span class="phase-tag">${phaseColor} ${dr.phase}</span>
            <span class="${rated ? `pill` : `pill-muted pill`}">
              ${rated ? RATING_LABELS[dr.rating] : `${dr.plannedMinutes} min`}
            </span>
          </div>
          <div class="title">${esc(drill.name)}</div>
          <div class="summary">${esc(drill.summary)}</div>
        </div>`;
    }).join("")}

    <button class="btn btn-primary mt-12" data-action="open-runner" data-index="${startIndex}">
      ${done === 0 ? "▶ Start Session" : "▶ Resume Session"}
    </button>
    ${done === s.drills.length && !s.completedAt ? `
      <button class="btn btn-secondary mt-12" data-action="finalize-session">
        ✓ Finish &amp; Save
      </button>` : ""}
  `;
}

function phaseEmoji(p) {
  return p === "warmup" ? "🔥" : p === "block" ? "🎯" : p === "transfer" ? "🔀" : "🍃";
}

// ----- Runner -----
function renderRunner() {
  const s = getSession(view.sessionId);
  if (!s) return renderEmpty("Session not found");
  const idx = view.drillIndex;
  if (idx >= s.drills.length) return renderRunnerDone(s);
  const dr = s.drills[idx];
  const drill = DRILLS_BY_ID[dr.drillID];
  if (!drill) return renderEmpty("Drill not found");

  const ratingSheet = view.rating.open ? renderRatingSheet(dr, drill) : "";

  return `
    ${topBar(drill.name, "plan")}
    <div class="muted" style="display:flex; justify-content:space-between; font-size:13px;">
      <span>Drill ${idx + 1} of ${s.drills.length}</span>
      <span>${phaseEmoji(dr.phase)} ${dr.phase}</span>
    </div>
    <div class="progress mb-16"><div class="fill" style="width:${((idx) / s.drills.length) * 100}%;"></div></div>

    <div class="card">
      <h2 style="margin-bottom:6px;">${esc(drill.name)}</h2>
      <p class="muted" style="margin-bottom:10px;">${esc(drill.summary)}</p>

      </div>

      <div class="row gap-12">
        <button class="btn btn-secondary" id="timerToggle" data-action="toggle-timer" data-planned="${dr.plannedMinutes}">
          ${view.timer.running ? "⏸  Pause" : view.timer.elapsed > 0 ? "▶  Resume" : "▶  Start"}

    ` : ""}

}

// ----- Summary -----
function renderSummary() {
  const s = getSession(view.sessionId);
  if (!s) return renderEmpty("Session not found");
  const before = s.skillSnapshot || {};
  const after = currentMeans();
  const deltas = SKILL_KEYS
    .map(k => {
      const b = before[k] ?? 0.5;
      const a = after[k] ?? b;
      return { k, b, a, d: a - b };
    })
    .filter(x => Math.abs(x.d) >= 0.005)
    .sort((a, b) => Math.abs(b.d) - Math.abs(a.d));

  return `
    ${topBar("Summary", "home")}
    <div class="card">
      <p class="muted" style="margin-bottom:8px;">${new Date(s.createdAt).toLocaleString()}</p>
      <div class="row spread mb-8">
        <span>${FACILITIES[s.facility].emoji} ${FACILITIES[s.facility].name}</span>
        <span class="muted">${s.targetMinutes} min</span>
      </div>
      <div class="stats">
        <div class="stat"><div class="val">${s.drills.length}</div><div class="label">Drills</div></div>
        <div class="stat"><div class="val">${s.drills.filter(d => d.rating !== null).length}</div><div class="label">Rated</div></div>
        <div class="stat"><div class="val">${avgRating(s).toFixed(1)}</div><div class="label">Avg</div></div>
      </div>
    </div>

    <div class="card">
      <h3>Drills</h3>
      ${s.drills.map(dr => {
        const drill = DRILLS_BY_ID[dr.drillID];
        if (!drill) return "";
        const r = dr.rating;
        return `
          <div style="padding:8px 0; border-bottom:1px solid var(--border);">
            <div class="row spread">
              <span style="font-weight:600;">${phaseEmoji(dr.phase)} ${esc(drill.name)}</span>
              <span class="pill ${r === null ? "pill-muted" : ""}" style="color:${r === null ? '' : ratingColorVar(r)};">
                ${r === null ? "—" : RATING_LABELS[r]}
              </span>
            </div>
            ${dr.notes ? `<div class="tiny" style="font-style:italic; margin-top:4px;">"${esc(dr.notes)}"</div>` : ""}
          </div>`;
      }).join("")}
    </div>

    <div class="card">
      <h3>How the model moved</h3>
      ${deltas.length === 0 ? `<p class="muted">No skill changes yet — rate some drills to update.</p>` :
        deltas.map(d => `
          <div class="row spread" style="padding:6px 0;">
            <span style="flex:1;">${SKILLS[d.k]}</span>
            <span class="muted tiny" style="margin-right:10px;">
              ${Math.round(d.b * 100)}% → ${Math.round(d.a * 100)}%
            </span>
            <span class="${d.d > 0 ? "delta-pos" : "delta-neg"}" style="min-width:40px; text-align:right;">
              ${d.d > 0 ? "+" : ""}${Math.round(d.d * 100)}
            </span>
          </div>`).join("")}
    </div>

    <button class="btn btn-secondary mt-12" data-action="navigate" data-screen="home">Back to home</button>
  `;
}

function ratingColorVar(r) {
  return r === 1 ? "var(--red)"
       : r === 2 ? "var(--orange)"
       : r === 3 ? "var(--yellow)"
       : r === 4 ? "var(--mint)"
       : "var(--green)";
}

function avgRating(s) {
  const rs = s.drills.filter(d => d.rating !== null).map(d => d.rating);
  if (rs.length === 0) return 0;
  return rs.reduce((a, b) => a + b, 0) / rs.length;
}

  `;
}

function skillBarHTML(k) {
  const s = state.skills[k];
  const mean = skillMean(s);
  const sd = skillStddev(s);
  const lo = Math.max(0, mean - sd);
  const hi = Math.min(1, mean + sd);
  const c = colorForMean(mean);
  const obs = s ? s.observationCount : 0;
  return `
    <div class="skill-row">
      <div class="top-row">
        <span>${SKILLS[k]}</span>
        <span style="color:${c}; font-weight:700;">${Math.round(mean * 100)}%</span>
      </div>
      <div class="skill-bar">
        <div class="uncertainty" style="left:${lo*100}%; width:${(hi-lo)*100}%; background:${c};"></div>
        <div class="mean" style="width:${mean*100}%; background:${c};"></div>
      </div>
      <div class="tiny" style="margin-top:2px;">${obs > 0 ? `${obs} observation${obs===1?"":"s"}` : "No data yet"}</div>
    </div>`;
}

// ----- Empty fallback -----
function renderEmpty(msg) {
  return `${topBar(msg, "home")}<div class="empty"><div class="icon">⚠️</div><p>${esc(msg)}</p></div>`;
}

// ----- Render dispatcher -----
function render() {
  let content;
  switch (view.screen) {
    case "home":    content = renderHome();    break;
    case "setup":   content = renderSetup();   break;
    case "plan":    content = renderPlan();    break;
    case "runner":  content = renderRunner();  break;
    case "summary": content = renderSummary(); break;
    case "history": content = renderHistory(); break;
    case "skills":  content = renderSkills();  break;
    default:        content = renderEmpty("Unknown screen");
  }
  document.getElementById("app").innerHTML = content + tabBar();
}

function timeAgo(ts) {
  const diff = (Date.now() - ts) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff/60) + " min ago";
  if (diff < 86400) return Math.floor(diff/3600) + " h ago";
  if (diff < 604800) return Math.floor(diff/86400) + " d ago";
  return new Date(ts).toLocaleDateString();
}

// ---------- 10. Event handling ----------
// Single delegated listeners installed once at boot.

function onClick(e) {
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const action = target.dataset.action;
  try { handleAction(action, target, e); } catch (err) { console.error(err); }
}

function onInput(e) {
  const t = e.target;
  if (t.id === "minSlider" && view.setup) {
    view.setup.minutes = parseInt(t.value, 10);
    const v = document.getElementById("minVal");
    if (v) v.textContent = `${view.setup.minutes} min`;
  } else if (t.id === "ratingNotes") {
    view.rating.notes = t.value;
  }
}

function handleAction(action, target, ev) {
  switch (action) {
    case "navigate": {
      navigate(target.dataset.screen);
      break;
    }
    case "set-facility": {
      view.setup.facility = target.dataset.key;
      render();
      break;
    }
    case "toggle-club": {
      const k = target.dataset.key;
      if (view.setup.clubs.has(k)) view.setup.clubs.delete(k);
      else view.setup.clubs.add(k);
      render();
      break;
    }
    case "generate": {
      const clubs = [...view.setup.clubs];
      if (clubs.length === 0) return;
      // persist prefs
      state.preferences.lastFacility = view.setup.facility;
      state.preferences.lastClubs = clubs;
      state.preferences.lastTargetMinutes = view.setup.minutes;
      const s = createSession({
        facility: view.setup.facility,
        clubs,
        targetMinutes: view.setup.minutes,
      });
      view.setup = null; // reset
      navigate("plan", { sessionId: s.id });
      break;
    }
    case "open-session": {
      const s = getSession(target.dataset.id);
      if (!s) return;
      view.sessionId = s.id;
      navigate(s.completedAt ? "summary" : "plan");
      break;
    }
    case "open-runner": {
      const idx = parseInt(target.dataset.index, 10);
      view.drillIndex = idx;
      navigate("runner");
      break;
    }
    case "toggle-timer": {
      const planned = parseInt(target.dataset.planned, 10);
      view.timer.planned = planned;
      if (view.timer.running) pauseTimer();
      else startTimer(planned);
      break;
    }
    case "reset-timer": {
      resetTimer();
      break;
    }
    case "open-rating": {
      const s = getSession(view.sessionId);
      const dr = s.drills[view.drillIndex];
      view.rating = { open: true, rating: dr.rating, notes: dr.notes };
      pauseTimer();
      render();
      break;
    }
    case "close-rating": {
      // Only close when the click is directly on the backdrop. Clicks on
      // children of the sheet bubble up here too; ignore those.
      if (ev && ev.target !== target) return;
      view.rating = { open: false, rating: null, notes: "" };
      render();
      break;
    }
    case "select-rating": {
      view.rating.rating = parseInt(target.dataset.rating, 10);
      render();
      break;
    }
    case "save-rating": {
      const r = view.rating.rating;
      if (r === null) return;
      const s = getSession(view.sessionId);
      const dr = s.drills[view.drillIndex];
      dr.rating = r;
      dr.notes = view.rating.notes;
      dr.completedAt = Date.now();
      const drill = DRILLS_BY_ID[dr.drillID];
      applyRating(r, drill);
      // Auto-complete session if all rated.
      if (s.drills.every(d => d.rating !== null) && !s.completedAt) {
        s.completedAt = Date.now();
      }
      saveState();
      view.rating = { open: false, rating: null, notes: "" };
      // Advance if there's another drill
      if (view.drillIndex < s.drills.length - 1) {
        view.drillIndex += 1;
        stopTimer();
      }
      render();
      break;
    }
    case "next-drill": {
      const s = getSession(view.sessionId);
      if (view.drillIndex < s.drills.length - 1) {
        view.drillIndex += 1;
        stopTimer();
        render();
      }
      break;
    }
    case "show-summary": {
      navigate("summary");
      break;
    }
    case "finalize-session": {
      const s = getSession(view.sessionId);
      if (!s) return;
      s.completedAt = Date.now();
      saveState();
      navigate("summary");
      break;
    }
    case "clear-history": {
      if (confirm("Delete all sessions and reset the skill model? This cannot be undone.")) {
        state = defaultState();
        saveState();
        render();
      }
      break;
    }
    case "seed-demo": {
      seedDemoData();
      render();
      break;
    }
  }
}

// ---------- 11. Demo data seeder ----------

function seedDemoData() {
  // Create 3 plausible past sessions with ratings biased toward weak short game
  // and decent driver, so the next generation visibly tilts the focus areas.
  state.sessions = [];
  state.skills = {};

  const facilities = ["fullFacility", "rangeShortGame", "fullFacility"];
  const clubs = ["putter","wedges","shortIrons","midIrons","longIrons","driver"];
  const days = [7, 4, 1];

  for (let i = 0; i < 3; i++) {
    const targetMinutes = [60, 45, 50][i];
    const plan = generatePlan({ facility: facilities[i], clubs, targetMinutes });
    const session = {
      id: "s_demo_" + i,
      createdAt: Date.now() - days[i] * 86400000,
      completedAt: Date.now() - days[i] * 86400000 + targetMinutes * 60000,
      facility: facilities[i],
      clubs: [...clubs],
      targetMinutes,
      skillSnapshot: currentMeans(),
      drills: plan.map((p, idx) => {
        // Bias ratings — putting/chip = poor/below, irons = avg/good, driver = good
        let rating = 3;
        if (p.drill.skillAreas.some(s => s.startsWith("putting") || s.startsWith("chipping"))) {
          rating = Math.random() < 0.6 ? 1 : 2;
        } else if (p.drill.skillAreas.some(s => s.startsWith("driver"))) {
          rating = Math.random() < 0.5 ? 4 : 5;
        } else if (p.drill.skillAreas.some(s => s.startsWith("iron"))) {
          rating = Math.random() < 0.5 ? 3 : 4;
        }
        applyRating(rating, p.drill);
        return {
          drillID: p.drill.id, order: idx, phase: p.phase,
          plannedMinutes: p.minutes,
          rating,
          notes: "",
          completedAt: Date.now() - days[i] * 86400000 + idx * 5 * 60000,
        };
      }),
    };
    state.sessions.unshift(session);
  }
  saveState();
}

// ---------- 12. Boot ----------

document.addEventListener("click", onClick);
document.addEventListener("input", onInput);

render();

// Refresh timer display when returning from background.
document.addEventListener("visibilitychange", () => { if (!document.hidden) updateTimerUI(); });

</script>
