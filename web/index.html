<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F8A2A">
<title>Range Caddy</title>
<style>
  :root {
    --green: #0F8A2A;
    --green-dark: #0A6A20;
    --green-soft: rgba(15, 138, 42, 0.10);
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --text: #111111;
    --muted: #6B7280;
    --border: #E5E5E0;
    --red: #C0392B;
    --yellow: #D4A017;
    --shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --green: #2DBF4C;
      --green-dark: #28A744;
      --green-soft: rgba(45, 191, 76, 0.16);
      --bg: #0A0A0A;
      --card: #1A1A1A;
      --text: #F5F5F5;
      --muted: #9A9A9A;
      --border: #2A2A2A;
      --red: #FF5547;
      --yellow: #F5C842;
      --shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px max(24px, env(safe-area-inset-bottom)) 20px;
  }

  h1 { font-size: 32px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 24px; font-weight: 700; margin: 0 0 4px 0; letter-spacing: -0.01em; }
  h3 { font-size: 14px; font-weight: 700; margin: 0 0 12px 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  p { margin: 0; }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0 24px;
  }
  .back {
    background: none; border: none; color: var(--green);
    font-size: 17px; font-weight: 600; cursor: pointer;
    padding: 8px 0; margin-left: -4px;
    font-family: inherit;
  }
  .stepcount { color: var(--muted); font-size: 14px; font-weight: 600; }

  /* Buttons */
  .btn {
    border: none;
    border-radius: 14px;
    padding: 18px 20px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    transition: transform 0.06s, opacity 0.1s;
  }
  .btn:active { transform: scale(0.98); opacity: 0.85; }
  .btn-primary {
    background: var(--green);
    color: white;
    box-shadow: 0 4px 14px rgba(15, 138, 42, 0.25);
  }
  .btn-ghost {
    background: transparent;
    color: var(--green);
    font-weight: 600;
    padding: 12px;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Home hero */
  .hero {
    margin-top: 56px;
    margin-bottom: 16px;
  }
  .hero h1 {
    font-size: 40px;
    line-height: 1.1;
  }
  .hero .tag {
    color: var(--muted);
    margin: 6px 0 32px;
    font-size: 16px;
  }

  /* Choice grids */
  .choice-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .choice-2 { grid-template-columns: repeat(2, 1fr); }
  .choice {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 18px 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-height: 76px;
    transition: transform 0.06s, border-color 0.1s, background 0.1s;
  }
  .choice:active { transform: scale(0.97); }
  .choice.on {
    border-color: var(--green);
    background: var(--green-soft);
    color: var(--green);
  }
  .choice .big {
    font-size: 22px;
    font-weight: 800;
  }
  .choice .sub {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  .choice.on .sub { color: var(--green); opacity: 0.85; }
  .choice .ico { font-size: 22px; }

  /* Drill card */
  .drill {
    margin-top: 8px;
  }
  .drill .phase {
    color: var(--green);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .drill h2 {
    font-size: 30px;
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .drill .summary {
    color: var(--muted);
    font-size: 17px;
    margin-bottom: 22px;
  }
  .drill .planned {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  ol.steps {
    padding: 0;
    margin: 0 0 22px 0;
    list-style: none;
    counter-reset: stp;
  }
  ol.steps li {
    counter-increment: stp;
    padding: 12px 14px 12px 44px;
    position: relative;
    background: var(--card);
    border-radius: 12px;
    margin-bottom: 8px;
    font-size: 16px;
    line-height: 1.45;
    box-shadow: var(--shadow);
  }
  ol.steps li::before {
    content: counter(stp);
    position: absolute;
    left: 12px;
    top: 12px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--green-soft);
    color: var(--green);
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pass {
    background: var(--green-soft);
    border-left: 3px solid var(--green);
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 28px;
    font-size: 15px;
  }
  .pass .label {
    color: var(--green);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 4px;
  }

  /* Rating */
  .rate-prompt {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .rate-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .rate {
    border: 2px solid var(--border);
    background: var(--card);
    border-radius: 14px;
    padding: 18px 8px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--text);
    font-weight: 700;
    transition: transform 0.06s;
  }
  .rate:active { transform: scale(0.96); }
  .rate .ico { font-size: 28px; line-height: 1; }
  .rate .lbl { font-size: 14px; }
  .rate.r1 { border-color: rgba(192, 57, 43, 0.4); }
  .rate.r3 { border-color: rgba(212, 160, 23, 0.4); }
  .rate.r5 { border-color: rgba(15, 138, 42, 0.4); }
  .rate.r1:active { background: rgba(192, 57, 43, 0.10); }
  .rate.r3:active { background: rgba(212, 160, 23, 0.10); }
  .rate.r5:active { background: var(--green-soft); }

  /* Resume row */
  .resume {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    color: var(--text);
    text-align: left;
  }
  .resume strong { color: var(--green); font-weight: 700; }
  .resume .chev { color: var(--muted); }

  /* Done */
  .done {
    text-align: center;
    margin-top: 80px;
  }
  .done .check {
    font-size: 72px;
    margin-bottom: 12px;
  }
  .done h1 { margin-bottom: 10px; }
  .done p { color: var(--muted); margin-bottom: 30px; }

  /* History (kept minimal, only reachable from done) */
  .history-item {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .history-item .date { font-weight: 600; }
  .history-item .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* Misc */
  .center { text-align: center; }
  .muted { color: var(--muted); }
  .mt-12 { margin-top: 12px; }
  .mt-24 { margin-top: 24px; }
  .mb-8 { margin-bottom: 8px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-24 { margin-bottom: 24px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ─── Drill library (40 drills, condensed) ─── */
const D = [
  ["putt.gate","Gate Drill — 3 ft","Push 3-foot putts through a narrow tee gate.",["puttingShort"],["putter"],8,["warmup","block","cooldown"],"putt",["Set two tees just wider than your putter head, 3 ft from a flat hole.","Place a ball 3 ft from the cup, on the line through the gate.","Make 10 in a row through the gate AND into the cup.","Reset to zero on any miss."],"10 in a row clean."],
  ["putt.clock","Clock Drill","Six 3-foot putts around the hole. Miss one and restart.",["puttingShort","mentalPressure"],["putter"],10,["block","transfer"],"putt",["Place six balls evenly around a hole at 3 ft.","Hole each ball in order.","Any miss = reset all six."],"Clear the clock once."],
  ["putt.ladder","Distance Ladder","Lag to 10, 20, 30, 40 ft targets.",["puttingLag","puttingMid"],["putter"],10,["block"],"putt",["Drop tees at 10, 20, 30, and 40 feet on flat ground.","Hit one ball to each target, in order, then back down.","Score: inside 1 putter length = 2, inside 3 ft = 1."],"Score 12+ over 8 putts."],
  ["putt.9ball","9-Ball Test","3 balls each from 3, 6, and 9 feet.",["puttingShort","puttingMid"],["putter"],10,["block","transfer"],"putt",["Find a fairly straight putt.","Hit 3 from 3 ft, 3 from 6 ft, 3 from 9 ft.","Count makes."],"Make 7 of 9."],

  ["putt.eyes","Eyes-Closed Feel","Roll 15-footers with eyes closed.",["puttingLag"],["putter"],8,["warmup","cooldown"],"putt",["Pick a 15 ft target on flat ground.","Look at the target, then close your eyes.","Stroke the putt.","Open eyes only after it's rolling."],"Most finish inside a 3 ft circle."],
  ["putt.one","One-Handed Putts","Trail hand only from 6 ft.",["puttingShort","puttingMid"],["putter"],6,["warmup","block"],"putt",["Use only your trail hand on the grip.","Hit 10 putts from 6 ft.","Focus on stable wrist and center contact."],"Make 5 of 10."],
  ["putt.lag","Lag Funnel","Long putts must finish inside a 3-ft circle.",["puttingLag"],["putter"],12,["block"],"putt",["Mark a 3 ft circle around a hole.","Hit 6 from 30 ft. Then 6 from 40 ft. Then 6 from 50 ft.","Goal: every ball inside the circle."],"14+ of 18 in the circle."],
  ["putt.highhole","Hole-High 5-Footers","Reach the hole on every 5-footer.",["puttingShort","mentalPressure"],["putter"],6,["block","transfer"],"putt",["Pick a flat 5 ft putt.","Every ball must reach the hole — short doesn't count.","Hit 10."],"Make 7 of 10."],
  ["mix.chipputt","Chip-Then-Putt","Chip one, putt out. Commit on the first putt.",["transferRandom","chippingGreenside","puttingShort"],["wedges","putter"],12,["transfer"],"short",["From off the green, chip one ball at a hole.","Wherever it stops, putt it out (no marker).","Repeat 8 times from different lies."],"5 of 8 up & down."],

  ["chip.highlow","High-Low Wedge","Same target, two trajectories.",["chippingGreenside"],["wedges","shortIrons"],10,["block"],"short",["Pick a hole ~15 yd away.","Hit 5 low bump-and-runs with PW.","Hit 5 high soft chips with LW.","Notice landing spot vs total roll."],"All 10 inside 6 ft."],

  ["chip.distance","Distance Wedges","Partial wedges at 30/40/50/60 yd.",["chippingPitch","wedgePartial"],["wedges"],15,["block"],"shortOrRange",["Use one wedge.","5 balls at 30, then 5 at 40, 50, 60.","Adjust by swing length, not effort.","Score: ≤8 yd = 1, ≤4 yd = 2."],"Score 24+ of 40."],
  ["chip.spin","Spin Control","High-spin vs low-spin to same target.",["chippingGreenside"],["wedges"],10,["block"],"short",["Pick a hole 12 yd away.","5 high-spin chips: clean lie, sharp descent, hands forward.","5 low-spin chips: ball back, less wrist.","Compare landing patterns."],"Clear difference in roll-out groups."],

  ["iron.9w","9-Window with 7i","High/mid/low × L/C/R.",["ironMid"],["midIrons"],14,["block"],"range",["Target ~150 yd.","Hit 9 balls, one for each cell of a 3×3 grid.","Plan each ball flight before you swing."],"5+ shots match intent."],
  ["iron.num","Number Game","Call the carry, hit it.",["ironShort","ironMid","ironLong"],["shortIrons","midIrons","longIrons"],15,["block","transfer"],"range",["Pick a club + a target line.","Before each swing, call a carry number aloud.","Hit. Compare to actual.","5 shots per club, PW → 6-iron."],"Average miss < 6 yd."],

  ["iron.random","Random Club Carousel","Switch clubs every shot.",["transferRandom","ironMid","ironShort","ironLong"],["shortIrons","midIrons","longIrons","wedges"],14,["transfer"],"range",["Write down 6 clubs (e.g. 7i, SW, 9i, hybrid, PW, 5i).","Pick a different target for each.","Full routine on every ball.","12 shots, switch club every shot."],"Hit your target line on 9 of 12."],
  ["iron.stinger","Stinger Drill","Low 5-iron knock-down.",["ironLong"],["longIrons"],10,["block"],"range",["Tee low or hit off turf.","5-iron. Ball 1 in. back of center, hands ahead.","3/4 swing, low abbreviated finish.","8 balls focused on flighting it down."],"Peaks under tree-height; consistent shape."],
  ["iron.alley","Fairway Alley","Mid-iron tee shots into a 20-yd alley.",["ironMid","driverAccuracy"],["midIrons"],10,["block","transfer"],"range",["Pick two range markers ~20 yd apart.","Tee up. Mid iron.","10 tee shots — each must land in the alley.","Crushing it? Narrower."],"8 of 10 in the alley."],
  ["iron.stripe","Stripe Test 6i","Ball-first contact with a 6-iron.",["ironMid"],["midIrons"],10,["warmup","block"],"range",["Foot powder or impact tape if you have it.","10 balls with 6-iron, divot AFTER the ball.","Self-rate strike: thin / center / heavy."],"7 of 10 center strikes."],
  ["iron.ladder","Iron Ladder","Same swing, descending clubs.",["ironShort","ironMid"],["shortIrons","midIrons"],12,["block"],"range",["3 shots each: PW, 9, 8, 7, 6.","Same tempo every time.","Look for ~10 yd gaps."],"Clean ordering, gaps within 4 yd."],
  ["iron.closeout","Pressure Closeout","Three in a row inside 10 yd or restart.",["mentalPressure","ironMid","ironShort"],["shortIrons","midIrons"],10,["transfer"],"range",["Pick a club + a flag.","3 consecutive shots within 10 yd.","Any miss resets to 0.","Limit: 15 balls."],"Chain of 3 within the budget."],

  ["wd.sweep","Fairway Wood Sweep","3-wood off turf — no divot.",["woodsHybrid"],["fairwayWoods"],10,["block"],"range",["Place a tee 6 in. behind the ball, lying flat.","3-wood, sweep without disturbing it.","8 balls."],"6 of 8 clean."],
  ["wd.trouble","Hybrid From Trouble","Steeper hybrid swing.",["woodsHybrid"],["hybrids"],10,["block"],"range",["Set up a degraded lie (tee on ground or rough mat).","Hybrid. Steeper than a fairway-wood swing.","8 balls, get it airborne with shape."],"Most launch + travel intended shape."],
  ["wd.teedeck","Tee vs Deck","3-wood teed vs off the mat.",["woodsHybrid","driverAccuracy"],["fairwayWoods"],10,["block","transfer"],"range",["4 with 3-wood teed low.","4 with 3-wood off the mat/turf.","Compare contact + start direction."],"Both groups in a tight start window."],
  ["wd.decision","Club Decision Hole","Imagine a par 4; pick a club.",["woodsHybrid","transferRandom"],["hybrids","fairwayWoods","midIrons","driver"],12,["transfer"],"range",["Visualize a 380-yd par 4, bunkers at 250.","Pick what you'd hit off the tee.","3 shots to your intended target.","Then play the second shot from a guessed distance."],"Plan matches on 2 of 3."],

  ["drv.tee","Tee Height Variety","Three tee heights — see launch change.",["driverDistance"],["driver"],12,["block"],"range",["3 tee low (half-ball above crown).","3 standard.","3 high (ball fully above crown).","Note carry + spin for each."],"You can pick the best mix for carry + roll."],
  ["drv.shape","Fade-Draw Alternate","Force shape control.",["driverAccuracy"],["driver"],12,["block"],"range",["Pick a target line.","Shot #1: fade.","Shot #2: draw.","Repeat for 10 total."],"Each pair shows a clear shape difference."],
  ["drv.alley","Fairway Finder","Pound driver into a 30-yd alley.",["driverAccuracy"],["driver"],12,["block","transfer"],"range",["Two markers ~30 yd apart at driver carry.","10 drivers — each must land in the alley.","Consistent miss? Narrow that side."],"7 of 10 in."],

  ["mix.worst","Worst Ball","Hit two, play the worse one.",["mentalPressure","transferRandom"],["midIrons","shortIrons","wedges"],12,["transfer"],"range",["Pick a target.","Hit two balls.","Your next 'position' is the worse one.","10 shots."],"Stay in a 25-yd window 5+ in a row."],

  ["cool.lag","Lag Cool-Down","10 long putts. No scoring.",["puttingLag"],["putter"],5,["cooldown","warmup"],"putt",["10 putts of varied length on flat ground.","Watch each one finish.","Notice what good ones feel like."],"Walk away smooth."],
];

// Flatten into objects so the rest of the code reads nicely.
const DRILLS = D.map(d => ({
  id: d[0], name: d[1], summary: d[2],
  skillAreas: d[3], clubs: d[4],
  defaultMinutes: d[5], suitablePhases: d[6], zone: d[7],
  instructions: d[8], successCriteria: d[9],
}));
const DRILLS_BY_ID = Object.fromEntries(DRILLS.map(d => [d.id, d]));

/* ─── User-facing simple buckets ─── */

const TIMES = [30, 45, 60];

const FACILITIES = [
  { id: "full",  label: "Full Practice", sub: "Range + short + putting",  range: true,  short: true,  putt: true  },
  { id: "range", label: "Range",         sub: "Hitting bays only",        range: true,  short: false, putt: false },
  { id: "short", label: "Short Game",    sub: "Chipping + sand",          range: false, short: true,  putt: false },
  { id: "putt",  label: "Putting Green", sub: "Putting only",             range: false, short: false, putt: true  },
];
const FACILITIES_BY_ID = Object.fromEntries(FACILITIES.map(f => [f.id, f]));

const CLUB_BUCKETS = [
  { id: "putter",  label: "Putter",  clubs: ["putter"] },
  { id: "wedges",  label: "Wedges",  clubs: ["wedges"] },
  { id: "irons",   label: "Irons",   clubs: ["shortIrons", "midIrons", "longIrons"] },
  { id: "driver",  label: "Driver",  clubs: ["driver", "fairwayWoods", "hybrids"] },
];
const CLUB_BUCKETS_BY_ID = Object.fromEntries(CLUB_BUCKETS.map(b => [b.id, b]));

/* Map a drill's zone string to a facility check. */
function zoneOK(zone, facility) {
  const f = FACILITIES_BY_ID[facility];
  switch (zone) {
    case "putt":          return f.putt;
    case "short":         return f.short;
    case "shortOrRange":  return f.short || f.range;
    case "range":         return f.range;
    case "any":           return true;
  }
  return false;
}

/* Expand the user's club-bucket selection into the engine's club categories. */
function expandClubs(bucketIds) {
  const set = new Set();
  bucketIds.forEach(id => CLUB_BUCKETS_BY_ID[id].clubs.forEach(c => set.add(c)));
  return set;
}

/* ─── Storage ─── */

const STORAGE_KEY = "rangecaddy.v2";

function defaultState() {
  return {
    skills: {},
    sessions: [],
    prefs: { time: 45, facility: "full", clubs: ["putter","wedges","irons","driver"] },
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return { ...defaultState(), ...JSON.parse(raw) };
  } catch (e) {
    return defaultState();
  }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) {}
}

/* ─── Bayesian engine ─── */

const BASE_WEIGHT = 2.0;
const NEUTRAL_ALPHA = 2.0;
const NEUTRAL_BETA = 2.0;
const DECAY_HALF_LIFE_DAYS = 30;

// 3-point rating → success fraction
const RATING_TO_FRAC = { 1: 0.10, 3: 0.55, 5: 0.92 };

function freshSkill() {
  return { alpha: NEUTRAL_ALPHA, beta: NEUTRAL_BETA, observationCount: 0, lastUpdated: null };
}
function skillMean(s) {
  if (!s) return 0.5;
  return s.alpha / (s.alpha + s.beta);
}
function skillStddev(s) {
  if (!s) return 0.224; // Beta(2,2) stddev
  const sum = s.alpha + s.beta;
  if (sum <= 1) return 0.5;
  return Math.sqrt((s.alpha * s.beta) / (sum * sum * (sum + 1)));
}
function decayInPlace(s) {
  if (!s.lastUpdated) return;
  const days = (Date.now() - s.lastUpdated) / 86_400_000;
  if (days <= 0) return;
  const factor = Math.pow(0.5, days / DECAY_HALF_LIFE_DAYS);
  s.alpha = NEUTRAL_ALPHA + (s.alpha - NEUTRAL_ALPHA) * factor;
  s.beta  = NEUTRAL_BETA  + (s.beta  - NEUTRAL_BETA)  * factor;
}
function applyRating(rating, drill) {
  const r = RATING_TO_FRAC[rating];
  if (r === undefined) return;
  drill.skillAreas.forEach((skillKey, idx) => {
    const w = idx === 0 ? 1.0 : idx === 1 ? 0.6 : 0.4;
    const n = BASE_WEIGHT * w;
    if (!state.skills[skillKey]) state.skills[skillKey] = freshSkill();
    const s = state.skills[skillKey];
    decayInPlace(s);
    s.alpha += n * r;
    s.beta  += n * (1 - r);
    s.observationCount += 1;
    s.lastUpdated = Date.now();
  });
}
function needFor(skillKey) {
  const s = state.skills[skillKey];
  const mean = skillMean(s);
  const sd = skillStddev(s);
  const noise = (Math.random() - 0.5) * 0.04;
  return Math.max(0, (1 - mean) + 0.2 * sd + noise);
}

/* ─── Session generator ─── */

const ALL_SKILLS = [...new Set(DRILLS.flatMap(d => d.skillAreas))];

function timeBudget(target) {
  const warm = Math.max(5, Math.min(Math.round(target * 0.15), 10));
  const cool = target >= 35 ? Math.max(3, Math.min(Math.round(target * 0.10), 6)) : 0;
  const trans = target >= 40 ? Math.max(5, Math.min(Math.round(target * 0.20), 12)) : 0;
  const block = Math.max(10, target - warm - cool - trans);
  return { warmup: warm, block, transfer: trans, cooldown: cool };
}

function generatePlan({ facility, clubs, targetMinutes }) {
  const clubSet = expandClubs(clubs);
  const cands = DRILLS.filter(d =>
    zoneOK(d.zone, facility) && d.clubs.every(c => clubSet.has(c))
  );
  if (cands.length === 0) return [];

  // Recent drills (last 2 sessions) get a penalty.
  const recent = new Set();
  state.sessions.slice(0, 2).forEach(s => s.drills.forEach(d => recent.add(d.drillID)));

  // Need per skill.
  const need = {};
  ALL_SKILLS.forEach(k => need[k] = needFor(k));

  // Untrainable in this session → zero.
  const trainable = new Set();
  cands.forEach(c => c.skillAreas.forEach(s => trainable.add(s)));
  Object.keys(need).forEach(k => { if (!trainable.has(k)) need[k] = 0; });

  function score(drill) {
    if (drill.skillAreas.length === 0) return 0;
    let tot = 0, ws = 0;
    drill.skillAreas.forEach((s, i) => {
      const w = i === 0 ? 1.0 : i === 1 ? 0.6 : 0.4;
      tot += w * (need[s] || 0);
      ws += w;
    });
    let s = tot / ws;
    if (recent.has(drill.id)) s *= 0.5;
    return s;
  }
  function best(pool) {
    if (pool.length === 0) return null;
    return pool.reduce((a, b) => score(a) > score(b) ? a : b);
  }

  const budget = timeBudget(targetMinutes);
  const used = new Set();
  const picked = [];

  // Warm-up
  let leftoverFromOptional = 0;
  const w = best(cands.filter(d =>
    !used.has(d.id) && d.suitablePhases.includes("warmup")
  ));
  if (w) { used.add(w.id); picked.push({ drill: w, phase: "warmup", minutes: budget.warmup }); }
  else { leftoverFromOptional += budget.warmup; }

  // Focus blocks
  let remaining = budget.block;
  const maxBlocks = targetMinutes >= 30 ? 3 : 2;
  const blocks = [];
  for (let i = 0; i < maxBlocks; i++) {
    if (remaining < 6) break;
    const pick = best(cands.filter(d => !used.has(d.id) && d.suitablePhases.includes("block")));
    if (!pick) break;
    const weights = [0.50, 0.30, 0.20];
    let mins = Math.max(6, Math.min(Math.round(budget.block * weights[i]), remaining));
    if (Math.abs(mins - pick.defaultMinutes) <= 4) mins = Math.min(pick.defaultMinutes, remaining);
    remaining -= mins;
    used.add(pick.id);
    const p = { drill: pick, phase: "block", minutes: mins };
    blocks.push(p);
    picked.push(p);
  }
  if (remaining > 0 && blocks.length > 0) {
    const big = blocks.reduce((a, b) => a.minutes >= b.minutes ? a : b);
    big.minutes += remaining;
  }

  // Transfer
  if (budget.transfer > 0) {
    const t = best(cands.filter(d => !used.has(d.id) && d.suitablePhases.includes("transfer")));
    if (t) { used.add(t.id); picked.push({ drill: t, phase: "transfer", minutes: budget.transfer }); }
    else { leftoverFromOptional += budget.transfer; }
  }
  // Cool-down
  if (budget.cooldown > 0) {
    const c = best(cands.filter(d => !used.has(d.id) && d.suitablePhases.includes("cooldown")));
    if (c) picked.push({ drill: c, phase: "cooldown", minutes: budget.cooldown });
    else { leftoverFromOptional += budget.cooldown; }
  }
  // Donate any unused transfer/cooldown minutes back to the biggest focus block,
  // so the user gets the full session length they asked for.
  if (leftoverFromOptional > 0 && blocks.length > 0) {
    const big = blocks.reduce((a, b) => a.minutes >= b.minutes ? a : b);
    big.minutes += leftoverFromOptional;
  }

  // Fallback for very restrictive setups.
  if (picked.length === 0) {
    const f = best(cands);
    if (f) picked.push({ drill: f, phase: "block", minutes: targetMinutes });
  }
  return picked;
}

function createSession({ facility, clubs, targetMinutes }) {
  const plan = generatePlan({ facility, clubs, targetMinutes });
  const sess = {
    id: "s" + Date.now().toString(36),
    createdAt: Date.now(),
    completedAt: null,
    facility, clubs: [...clubs], targetMinutes,
    drills: plan.map((p, i) => ({
      drillID: p.drill.id, order: i, phase: p.phase,
      plannedMinutes: p.minutes,
      rating: null, completedAt: null,
    })),
  };
  state.sessions.unshift(sess);
  saveState();
  return sess;
}

/* ─── App state & router ─── */

let state = loadState();

const view = {
  screen: "home",        // home | setup | drill | done | history
  sessionId: null,
  drillIndex: 0,
  setup: null,           // working setup form: { time, facility, clubs:Set }
};

function go(screen, params = {}) {
  view.screen = screen;
  if (params.sessionId !== undefined) view.sessionId = params.sessionId;
  if (params.drillIndex !== undefined) view.drillIndex = params.drillIndex;
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function activeSession() { return state.sessions.find(s => s.id === view.sessionId); }

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

/* ─── Screens ─── */

function screenHome() {
  // Find an unfinished session, if any.
  const unfinished = state.sessions.find(s => !s.completedAt);
  const resumeBlock = unfinished ? `
    <button class="resume" data-action="resume" data-id="${unfinished.id}">
      <span>Continue last session<br><span class="muted" style="font-size:12px;">${unfinished.targetMinutes} min · ${unfinished.drills.length} drills</span></span>
      <span class="chev">›</span>
    </button>` : "";

  const historyLink = state.sessions.some(s => s.completedAt) ? `
    <div class="center mt-24">
      <button class="btn-ghost" data-action="go" data-screen="history" style="border:none;background:none;cursor:pointer;font-family:inherit;color:var(--muted);font-size:14px;">
        Past sessions
      </button>
    </div>` : "";

  return `
    <div class="hero">
      <h1>Range Caddy</h1>
      <p class="tag">Tell me what you've got. I'll build the session.</p>
      <button class="btn btn-primary" data-action="go" data-screen="setup">Start Practicing</button>
      ${resumeBlock}
    </div>
    ${historyLink}
  `;
}

function ensureSetup() {
  if (view.setup) return;
  const p = state.prefs;
  view.setup = {
    time: p.time,
    facility: p.facility,
    clubs: new Set(p.clubs),
  };
}

function screenSetup() {
  ensureSetup();
  const fac = view.setup.facility;
  // Filter club options based on facility — a putting-only setup doesn't need driver, etc.
  const facObj = FACILITIES_BY_ID[fac];

  return `
    <div class="top">
      <button class="back" data-action="go" data-screen="home">‹ Back</button>
      <div></div>
    </div>

    <h3>How long?</h3>
    <div class="choice-row">
      ${TIMES.map(t => `
        <button class="choice ${view.setup.time === t ? "on" : ""}" data-action="set-time" data-value="${t}">
          <span class="big">${t}</span>
          <span class="sub">minutes</span>
        </button>
      `).join("")}
    </div>

    <h3>Where are you?</h3>
    <div class="choice-row choice-2">
      ${FACILITIES.map(f => `
        <button class="choice ${view.setup.facility === f.id ? "on" : ""}" data-action="set-facility" data-value="${f.id}">
          <span style="font-size:17px;font-weight:700;">${esc(f.label)}</span>
          <span class="sub">${esc(f.sub)}</span>
        </button>
      `).join("")}
    </div>

    <h3>What clubs?</h3>
    <div class="choice-row choice-2">
      ${CLUB_BUCKETS.map(c => {
        const on = view.setup.clubs.has(c.id);
        // Grey out clubs that don't fit the facility (e.g. driver on putting green).
        const ok = clubFitsFacility(c.id, facObj);
        return `
          <button class="choice ${on && ok ? "on" : ""}" data-action="toggle-club" data-value="${c.id}" ${ok ? "" : "disabled"}
                  style="${ok ? "" : "opacity:0.35;cursor:not-allowed;"}">
            <span style="font-size:17px;font-weight:700;">${esc(c.label)}</span>
            <span class="sub">${on && ok ? "✓ selected" : ok ? "tap to add" : "not at this facility"}</span>
          </button>`;
      }).join("")}
    </div>

    <button class="btn btn-primary mt-12" data-action="generate" ${view.setup.clubs.size === 0 ? "disabled" : ""}>
      Build my session
    </button>
  `;
}

function clubFitsFacility(bucketId, facObj) {
  switch (bucketId) {
    case "putter": return facObj.putt || facObj.range;
    case "wedges": return facObj.short || facObj.range;
    case "irons":  return facObj.range;
    case "driver": return facObj.range;
  }
  return true;
}

function phaseLabel(p) {
  return p === "warmup" ? "Warm-up"
       : p === "block"  ? "Focus"
       : p === "transfer" ? "Pressure"
       : "Cool-down";
}

function screenDrill() {
  const s = activeSession();
  if (!s) return screenEmpty("Session not found");
  if (view.drillIndex >= s.drills.length) {
    // We blew past the last drill — go to done.
    if (!s.completedAt) { s.completedAt = Date.now(); saveState(); }
    return screenDone(s);
  }
  const dr = s.drills[view.drillIndex];
  const drill = DRILLS_BY_ID[dr.drillID];
  if (!drill) return screenEmpty("Drill not found");

  return `
    <div class="top">
      <button class="back" data-action="go" data-screen="home">‹ Quit</button>
      <span class="stepcount">${view.drillIndex + 1} of ${s.drills.length}</span>
    </div>

    <div class="drill">
      <div class="phase">${phaseLabel(dr.phase)}</div>
      <h2>${esc(drill.name)}</h2>
      <p class="summary">${esc(drill.summary)}</p>
      <p class="planned">⏱ <span>${dr.plannedMinutes} min suggested</span></p>

      <ol class="steps">
        ${drill.instructions.map(step => `<li>${esc(step)}</li>`).join("")}
      </ol>

      <div class="pass">
        <span class="label">Pass when</span>
        <span>${esc(drill.successCriteria)}</span>
      </div>

      <div class="rate-prompt">How'd that go?</div>
      <div class="rate-row">
        <button class="rate r1" data-action="rate" data-value="1">
          <span class="ico">😬</span><span class="lbl">Struggled</span>
        </button>
        <button class="rate r3" data-action="rate" data-value="3">
          <span class="ico">👌</span><span class="lbl">Solid</span>
        </button>
        <button class="rate r5" data-action="rate" data-value="5">
          <span class="ico">🔥</span><span class="lbl">Dialed</span>
        </button>
      </div>
    </div>
  `;
}

function screenDone(s) {
  const minutes = s ? s.targetMinutes : 0;
  const drillCount = s ? s.drills.length : 0;
  return `
    <div class="done">
      <div class="check">✓</div>
      <h1>Nice work.</h1>
      <p>${drillCount} drills · ${minutes} min<br>The model just learned from this one.</p>
      <button class="btn btn-primary" data-action="go" data-screen="home">Done</button>
    </div>
  `;
}

function screenHistory() {
  const done = state.sessions.filter(s => s.completedAt);
  if (done.length === 0) {
    return `
      <div class="top">
        <button class="back" data-action="go" data-screen="home">‹ Back</button>
        <div></div>
      </div>
      <p class="muted center mt-24">Nothing here yet.</p>
    `;
  }
  return `
    <div class="top">
      <button class="back" data-action="go" data-screen="home">‹ Back</button>
      <div></div>
    </div>
    <h3>Past sessions</h3>
    ${done.map(s => `
      <div class="history-item">
        <div class="date">${new Date(s.createdAt).toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" })}</div>
        <div class="meta">${s.targetMinutes} min · ${s.drills.length} drills · ${FACILITIES_BY_ID[s.facility]?.label || s.facility}</div>
      </div>
    `).join("")}
  `;
}

function screenEmpty(msg) {
  return `
    <div class="top"><button class="back" data-action="go" data-screen="home">‹ Back</button><div></div></div>
    <p class="muted center mt-24">${esc(msg)}</p>
  `;
}

/* ─── Render dispatcher ─── */

function render() {
  let html;
  switch (view.screen) {
    case "home":    html = screenHome();    break;
    case "setup":   html = screenSetup();   break;
    case "drill":   html = screenDrill();   break;
    case "done":    html = screenDone(activeSession()); break;
    case "history": html = screenHistory(); break;
    default:        html = screenEmpty("Unknown screen");
  }
  document.getElementById("app").innerHTML = html;
}

/* ─── Event handling ─── */

function onClick(e) {
  const target = e.target.closest("[data-action]");
  if (!target || target.disabled) return;
  const action = target.dataset.action;
  switch (action) {
    case "go": {
      // Reset setup when leaving the form, so values aren't sticky across runs.
      if (target.dataset.screen === "home" && view.screen === "setup") view.setup = null;
      go(target.dataset.screen);
      break;
    }
    case "set-time": {
      view.setup.time = parseInt(target.dataset.value, 10);
      render();
      break;
    }
    case "set-facility": {
      view.setup.facility = target.dataset.value;
      // Auto-deselect clubs that no longer fit (e.g. user picks "Putting Green").
      const fac = FACILITIES_BY_ID[view.setup.facility];
      for (const id of [...view.setup.clubs]) {
        if (!clubFitsFacility(id, fac)) view.setup.clubs.delete(id);
      }
      // Auto-add a sensible default if nothing's selected.
      if (view.setup.clubs.size === 0) {
        if (view.setup.facility === "putt") view.setup.clubs.add("putter");
        else if (view.setup.facility === "short") view.setup.clubs.add("wedges");
      }
      render();
      break;
    }
    case "toggle-club": {
      const id = target.dataset.value;
      if (view.setup.clubs.has(id)) view.setup.clubs.delete(id);
      else view.setup.clubs.add(id);
      render();
      break;
    }
    case "generate": {
      const clubs = [...view.setup.clubs];
      if (clubs.length === 0) return;
      // Persist prefs.
      state.prefs = { time: view.setup.time, facility: view.setup.facility, clubs };
      const sess = createSession({
        facility: view.setup.facility,
        clubs,
        targetMinutes: view.setup.time,
      });
      view.setup = null;
      view.sessionId = sess.id;
      view.drillIndex = 0;
      go("drill");
      break;
    }
    case "resume": {
      const s = state.sessions.find(x => x.id === target.dataset.id);
      if (!s) return;
      view.sessionId = s.id;
      const firstUnrated = s.drills.findIndex(d => d.rating === null);
      view.drillIndex = firstUnrated === -1 ? 0 : firstUnrated;
      go("drill");
      break;
    }
    case "rate": {
      const r = parseInt(target.dataset.value, 10);
      const s = activeSession();
      if (!s) return;
      const dr = s.drills[view.drillIndex];
      dr.rating = r;
      dr.completedAt = Date.now();
      applyRating(r, DRILLS_BY_ID[dr.drillID]);
      // Advance.
      if (view.drillIndex < s.drills.length - 1) {
        view.drillIndex += 1;
        saveState();
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
      } else {
        if (!s.completedAt) s.completedAt = Date.now();
        saveState();
        go("done");
      }
      break;
    }
  }
}

document.addEventListener("click", onClick);
render();
</script>
</body>
</html>
